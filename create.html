<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar Link de Pagamento — PlayM0z</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="tron-grid"></div>
  <div class="scanlines"></div>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text">Play<span class="accent">M0z</span></span>
      </a>
      <nav class="nav">
        <a href="index.html">Início</a>
        <a href="dashboard.html">Painel</a>
        <a href="docs.html">API</a>
        <a href="create.html" class="btn btn-primary">Criar Link</a>
      </nav>
      <button class="menu-toggle" id="menuToggle">☰</button>
    </div>
  </header>

  <section class="form-section">
    <div class="container">
      <h1 style="text-align:center;margin-bottom:0.5rem;font-size:1.8rem">Criar Link de <span class="accent">Pagamento</span></h1>
      <p style="text-align:center;color:var(--text-dim);margin-bottom:2rem">Gere uma referência única e partilhe com o cliente.</p>

      <div class="form-card">
        <form id="createForm">
          <div class="form-group">
            <label for="productTitle">Título do produto / serviço *</label>
            <input type="text" id="productTitle" placeholder="Ex: Curso de Marketing Digital" required />
          </div>

          <div class="form-group">
            <label for="amount">Valor (MZN) *</label>
            <input type="number" id="amount" min="10" step="1" placeholder="1500" required />
          </div>

          <div class="form-group">
            <label for="description">Descrição (opcional)</label>
            <textarea id="description" placeholder="Acesso vitalício, materiais incluídos..."></textarea>
          </div>

          <div class="form-group">
            <label for="sellerName">Seu nome / empresa</label>
            <input type="text" id="sellerName" placeholder="Ex: João Silva" />
          </div>

          <div class="form-group">
            <label for="sellerPhone">Número para receber (M-Pesa / eMola) *</label>
            <input type="tel" id="sellerPhone" placeholder="84XXXXXXX ou 86XXXXXXX" required />
          </div>

          <div class="form-group">
            <label for="preferredMethod">Método preferido</label>
            <select id="preferredMethod">
              <option value="any">Qualquer (M-Pesa + eMola)</option>
              <option value="mpesa">Apenas M-Pesa</option>
              <option value="emola">Apenas eMola</option>
              <option value="bank">Transferência bancária</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:0.5rem">
            Gerar Link & Referência
          </button>
        </form>

        <div id="paymentResult" class="payment-result">
          <h3 style="color:var(--success);margin-bottom:0.8rem">✓ Link criado com sucesso</h3>
          <p>Referência única:</p>
          <div class="ref-code" id="refCode"></div>
          
          <p style="margin-top:1rem">Link para partilhar com o cliente:</p>
          <a id="paymentLink" href="#" target="_blank" style="color:var(--cyan);word-break:break-all;font-size:0.9rem"></a>

          <div id="payInstructions" class="instructions" style="margin-top:1.5rem"></div>

          <div style="display:flex;gap:1rem;margin-top:1.5rem;flex-wrap:wrap">
            <a href="dashboard.html" class="btn btn-primary">Ir para o Painel</a>
            <button class="btn btn-ghost" onclick="navigator.clipboard.writeText(document.getElementById('refCode').textContent)">Copiar Referência</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>© 2026 PlayM0z — Pagamentos manuais controlados por si</p>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
